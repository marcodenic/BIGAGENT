[package]
name = "big-agent"
version = "0.1.0"
description = "An ambient room-scale display for autonomous agents"
authors = ["BIG AGENT contributors"]
edition = "2021"

[lib]
name = "big_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
