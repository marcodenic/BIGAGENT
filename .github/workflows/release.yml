name: Desktop release

on:
  push:
    tags: ["v*"]
    branches: ["codex/release-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm package --${{ matrix.arch }} --publish never
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a pnpm smoke
      - name: Smoke test packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm smoke
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = `v${version}`;
          const ref = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_EVENT_NAME === 'push' && ref !== tag && ref !== `codex/release-${tag}`) {
            throw new Error(`Release ref ${ref} does not match package version ${tag}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: all-installers-with-checksums
          path: release/*
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ startsWith(github.ref, 'refs/heads/codex/release-') || contains(github.ref_name, '-') }}
          body_path: docs/release-notes.md
          generate_release_notes: true
          files: release/*
